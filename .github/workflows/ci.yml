name: Library Book Records CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f wrong-file.js

      - name: Check HTML file
        run: |
          grep -q "<html" index.html
          grep -q "</html>" index.html

      - name: Build and test
        run: echo "Library Book Records application passed CI checks."
