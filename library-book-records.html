<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf Ledger — Library Book Records</title>
<style>
  :root {
    --cream:      #F4E9DA;
    --parchment:  #EADCC5;
    --caramel:    #B8722E;
    --caramel-lt: #D69A5E;
    --coffee:     #4A2E1E;
    --coffee-dk:  #2E1B10;
    --bark:       #6F4518;
    --ok:         #4C7A3D;
    --warn:       #B8402E;
    --shadow:     rgba(46, 27, 16, 0.25);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(214,154,94,0.25), transparent 60%),
      linear-gradient(180deg, var(--cream), var(--parchment) 60%);
    color: var(--coffee-dk);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Noto Serif", serif;
    min-height: 100%;
    padding: 28px 18px 60px;
  }

  .wrap { max-width: 960px; margin: 0 auto; }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 3px double var(--bark);
    padding-bottom: 14px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  header.top h1 {
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--coffee-dk);
  }
  header.top .stamp {
    font-family: Georgia, serif;
    font-style: italic;
    color: var(--bark);
    font-size: 0.95rem;
    border: 1px solid var(--bark);
    padding: 4px 10px;
    border-radius: 3px;
    background: rgba(184,114,46,0.08);
    white-space: nowrap;
  }

  .panel {
    background: #FBF4E9;
    border: 1px solid #D8C3A0;
    border-radius: 10px;
    box-shadow: 0 6px 18px var(--shadow);
    padding: 20px;
    margin-bottom: 22px;
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 1.05rem;
    color: var(--bark);
    font-weight: 600;
    border-bottom: 1px solid #E1CBA5;
    padding-bottom: 8px;
  }

  form#book-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.wide { grid-column: 1 / -1; }
  .field label {
    font-size: 0.8rem;
    color: var(--bark);
    font-weight: 600;
  }
  .field input, .field select {
    font-family: inherit;
    font-size: 0.98rem;
    padding: 9px 10px;
    border: 1px solid #CBAF85;
    border-radius: 6px;
    background: #FFFBF4;
    color: var(--coffee-dk);
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--caramel);
    outline-offset: 1px;
    border-color: var(--caramel);
  }

  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: transform 0.06s ease, box-shadow 0.15s ease;
  }
  button:active { transform: translateY(1px); }
  .btn-primary {
    background: linear-gradient(180deg, var(--caramel-lt), var(--caramel));
    color: #FFF9F0;
    box-shadow: 0 3px 8px rgba(74,46,30,0.3);
  }
  .btn-primary:hover { box-shadow: 0 4px 12px rgba(74,46,30,0.4); }
  .btn-ghost {
    background: transparent;
    color: var(--bark);
    border: 1px solid var(--bark);
  }
  .btn-ghost:hover { background: rgba(111,69,24,0.08); }
  #cancel-edit { display: none; }

  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .toolbar input[type="search"] {
    flex: 1 1 240px;
    padding: 10px 12px;
    border: 1px solid #CBAF85;
    border-radius: 6px;
    background: #FFFBF4;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .toolbar select {
    padding: 10px 12px;
    border: 1px solid #CBAF85;
    border-radius: 6px;
    background: #FFFBF4;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--coffee-dk);
  }
  .counts {
    font-size: 0.85rem;
    color: var(--bark);
    white-space: nowrap;
  }

  .table-scroll {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid #D8C3A0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 640px;
    background: #FFFBF4;
  }
  thead th {
    text-align: left;
    font-size: 0.78rem;
    font-weight: 700;
    color: #FFF3E2;
    background: var(--bark);
    padding: 11px 12px;
    position: sticky;
    top: 0;
  }
  tbody td {
    padding: 11px 12px;
    border-bottom: 1px solid #EADCC5;
    font-size: 0.92rem;
    vertical-align: top;
  }
  tbody tr:hover { background: rgba(214,154,94,0.12); }
  tbody tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    color: #fff;
  }
  .badge.available { background: var(--ok); }
  .badge.checked-out { background: var(--warn); }

  .row-actions { display: flex; gap: 8px; white-space: nowrap; }
  .icon-btn {
    background: none;
    border: 1px solid #CBAF85;
    color: var(--bark);
    padding: 5px 10px;
    font-size: 0.8rem;
    border-radius: 5px;
  }
  .icon-btn:hover { background: rgba(184,114,46,0.12); }
  .icon-btn.danger { color: var(--warn); border-color: var(--warn); }
  .icon-btn.danger:hover { background: rgba(184,64,46,0.1); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--bark);
  }
  .empty-state p { margin: 4px 0; }
  .empty-state .big { font-size: 1.4rem; margin-bottom: 6px; }

  footer {
    text-align: center;
    color: var(--bark);
    font-size: 0.8rem;
    margin-top: 30px;
    opacity: 0.8;
  }

  @media (max-width: 520px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      border-bottom: 2px solid var(--bark);
      padding: 10px 4px;
    }
    tbody td {
      border-bottom: none;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    tbody td::before {
      content: attr(data-label);
      font-weight: 700;
      color: var(--bark);
      font-size: 0.75rem;
    }
    .row-actions { justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>📚 Shelf Ledger</h1>
    <span class="stamp" id="today-stamp"></span>
  </header>

  <section class="panel">
    <h2 id="form-title">Add a book</h2>
    <form id="book-form" autocomplete="off">
      <input type="hidden" id="book-id">

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. The Silmarillion">
      </div>

      <div class="field">
        <label for="author">Author</label>
        <input type="text" id="author" required placeholder="e.g. J. R. R. Tolkien">
      </div>

      <div class="field">
        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" placeholder="e.g. 978-0-618-39118-6">
      </div>

      <div class="field">
        <label for="genre">Genre</label>
        <input type="text" id="genre" placeholder="e.g. Fantasy">
      </div>

      <div class="field">
        <label for="year">Year published</label>
        <input type="number" id="year" min="0" max="2100" placeholder="e.g. 1977">
      </div>

      <div class="field">
        <label for="status">Status</label>
        <select id="status">
          <option value="Available">Available</option>
          <option value="Checked Out">Checked Out</option>
        </select>
      </div>

      <div class="field wide">
        <label for="notes">Notes</label>
        <input type="text" id="notes" placeholder="Shelf location, condition, borrower, etc.">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="submit-btn">Add book</button>
        <button type="button" class="btn-ghost" id="cancel-edit">Cancel edit</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>Book records</h2>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search by title, author, ISBN or genre…">
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="Available">Available</option>
        <option value="Checked Out">Checked Out</option>
      </select>
      <span class="counts" id="counts"></span>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Genre</th>
            <th>Year</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="book-rows"></tbody>
      </table>
    </div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="big">The shelf is empty</div>
      <p>Add your first book above, or clear your search to see existing records.</p>
    </div>
  </section>

  <footer>Records are saved in this browser only — nothing is sent anywhere.</footer>
</div>

<script>
(function () {
  const STORAGE_KEY = 'shelfLedgerBooks';

  const form = document.getElementById('book-form');
  const idField = document.getElementById('book-id');
  const titleField = document.getElementById('title');
  const authorField = document.getElementById('author');
  const isbnField = document.getElementById('isbn');
  const genreField = document.getElementById('genre');
  const yearField = document.getElementById('year');
  const statusField = document.getElementById('status');
  const notesField = document.getElementById('notes');

  const formTitle = document.getElementById('form-title');
  const submitBtn = document.getElementById('submit-btn');
  const cancelBtn = document.getElementById('cancel-edit');

  const searchInput = document.getElementById('search');
  const filterStatus = document.getElementById('filter-status');
  const rowsBody = document.getElementById('book-rows');
  const emptyState = document.getElementById('empty-state');
  const countsEl = document.getElementById('counts');

  let books = loadBooks();

  function loadBooks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : seedBooks();
    } catch (e) {
      console.error('Could not read saved records, starting fresh.', e);
      return [];
    }
  }

  function seedBooks() {
    return [
      { id: cryptoId(), title: 'Pride and Prejudice', author: 'Jane Austen', isbn: '978-0-14-143951-8', genre: 'Classic', year: 1813, status: 'Available', notes: 'Shelf A2' },
      { id: cryptoId(), title: 'Dune', author: 'Frank Herbert', isbn: '978-0-441-01359-3', genre: 'Science Fiction', year: 1965, status: 'Checked Out', notes: 'Borrower: R. Malik' },
      { id: cryptoId(), title: 'The Hobbit', author: 'J. R. R. Tolkien', isbn: '978-0-547-92822-7', genre: 'Fantasy', year: 1937, status: 'Available', notes: 'Shelf B1' }
    ];
  }

  function saveBooks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
    } catch (e) {
      console.error('Could not save records to this browser.', e);
    }
  }

  function cryptoId() {
    return 'b_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function resetForm() {
    form.reset();
    idField.value = '';
    statusField.value = 'Available';
    formTitle.textContent = 'Add a book';
    submitBtn.textContent = 'Add book';
    cancelBtn.style.display = 'none';
  }

  function startEdit(id) {
    const book = books.find(b => b.id === id);
    if (!book) return;
    idField.value = book.id;
    titleField.value = book.title;
    authorField.value = book.author;
    isbnField.value = book.isbn || '';
    genreField.value = book.genre || '';
    yearField.value = book.year || '';
    statusField.value = book.status || 'Available';
    notesField.value = book.notes || '';
    formTitle.textContent = 'Edit book';
    submitBtn.textContent = 'Save changes';
    cancelBtn.style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    titleField.focus();
  }

  function deleteBook(id) {
    const book = books.find(b => b.id === id);
    if (!book) return;
    if (!confirm('Remove "' + book.title + '" from the ledger?')) return;
    books = books.filter(b => b.id !== id);
    saveBooks();
    render();
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function render() {
    const query = searchInput.value.trim().toLowerCase();
    const statusFilterVal = filterStatus.value;

    let visible = books.filter(b => {
      const matchesQuery = !query ||
        b.title.toLowerCase().includes(query) ||
        b.author.toLowerCase().includes(query) ||
        (b.isbn || '').toLowerCase().includes(query) ||
        (b.genre || '').toLowerCase().includes(query);
      const matchesStatus = !statusFilterVal || b.status === statusFilterVal;
      return matchesQuery && matchesStatus;
    });

    visible.sort((a, b) => a.title.localeCompare(b.title));

    rowsBody.innerHTML = '';

    if (visible.length === 0) {
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      visible.forEach(b => {
        const tr = document.createElement('tr');
        const statusClass = b.status === 'Available' ? 'available' : 'checked-out';
        tr.innerHTML =
          '<td data-label="Title"><strong>' + escapeHtml(b.title) + '</strong></td>' +
          '<td data-label="Author">' + escapeHtml(b.author) + '</td>' +
          '<td data-label="ISBN">' + escapeHtml(b.isbn) + '</td>' +
          '<td data-label="Genre">' + escapeHtml(b.genre) + '</td>' +
          '<td data-label="Year">' + escapeHtml(b.year) + '</td>' +
          '<td data-label="Status"><span class="badge ' + statusClass + '">' + escapeHtml(b.status) + '</span></td>' +
          '<td data-label="Notes">' + escapeHtml(b.notes) + '</td>' +
          '<td data-label="Actions"><div class="row-actions">' +
            '<button class="icon-btn" data-action="edit" data-id="' + b.id + '">Edit</button>' +
            '<button class="icon-btn danger" data-action="delete" data-id="' + b.id + '">Delete</button>' +
          '</div></td>';
        rowsBody.appendChild(tr);
      });
    }

    const total = books.length;
    const shown = visible.length;
    countsEl.textContent = shown === total
      ? total + ' book' + (total === 1 ? '' : 's') + ' total'
      : shown + ' of ' + total + ' shown';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const title = titleField.value.trim();
    const author = authorField.value.trim();
    if (!title || !author) return;

    const data = {
      title: title,
      author: author,
      isbn: isbnField.value.trim(),
      genre: genreField.value.trim(),
      year: yearField.value ? parseInt(yearField.value, 10) : '',
      status: statusField.value,
      notes: notesField.value.trim()
    };

    if (idField.value) {
      const book = books.find(b => b.id === idField.value);
      if (book) Object.assign(book, data);
    } else {
      books.push(Object.assign({ id: cryptoId() }, data));
    }

    saveBooks();
    resetForm();
    render();
  });

  cancelBtn.addEventListener('click', resetForm);

  rowsBody.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    if (btn.getAttribute('data-action') === 'edit') startEdit(id);
    if (btn.getAttribute('data-action') === 'delete') deleteBook(id);
  });

  searchInput.addEventListener('input', render);
  filterStatus.addEventListener('change', render);

  document.getElementById('today-stamp').textContent =
    new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

  render();
})();
</script>
</body>
</html>
