<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shelf Ledger — Library Book Records</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrap">

    <header class="top">
      <h1>📚 Library Book Records</h1>
      <span class="stamp" id="today-stamp"></span>
    </header>

    <section class="panel">
      <h2 id="form-title">Add a book</h2>

      <form id="book-form" autocomplete="off">
        <input type="hidden" id="book-id">

        <div class="field">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            required
            placeholder="e.g. The Silmarillion"
          >
        </div>

        <div class="field">
          <label for="author">Author</label>
          <input
            type="text"
            id="author"
            required
            placeholder="e.g. J. R. R. Tolkien"
          >
        </div>

        <div class="field">
          <label for="isbn">ISBN</label>
          <input
            type="text"
            id="isbn"
            placeholder="e.g. 978-0-618-39118-6"
          >
        </div>

        <div class="field">
          <label for="genre">Genre</label>
          <input
            type="text"
            id="genre"
            placeholder="e.g. Fantasy"
          >
        </div>

        <div class="field">
          <label for="year">Year published</label>
          <input
            type="number"
            id="year"
            min="0"
            max="2100"
            placeholder="e.g. 1977"
          >
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="Available">Available</option>
            <option value="Checked Out">Checked Out</option>
          </select>
        </div>

        <div class="field wide">
          <label for="notes">Notes</label>
          <input
            type="text"
            id="notes"
            placeholder="Shelf location, condition, borrower, etc."
          >
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submit-btn">
            Add book
          </button>

          <button type="button" class="btn-ghost" id="cancel-edit">
            Cancel edit
          </button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Book records</h2>

      <div class="toolbar">
        <input
          type="search"
          id="search"
          placeholder="Search by title, author, ISBN or genre..."
        >

        <select id="filter-status">
          <option value="">All statuses</option>
          <option value="Available">Available</option>
          <option value="Checked Out">Checked Out</option>
        </select>

        <span class="counts" id="counts"></span>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>ISBN</th>
              <th>Genre</th>
              <th>Year</th>
              <th>Status</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="book-rows"></tbody>
        </table>
      </div>

      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="big">The shelf is empty</div>
        <p>
          Add your first book above, or clear your search to see existing
          records.
        </p>
      </div>
    </section>

    <footer>
      Records are saved in this browser only — nothing is sent anywhere.
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
